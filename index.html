<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Weather Application</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="container">
		<h1> Find weather by Latitude & Longitude</h1>

		<form onsubmit="getweather(event)">
			<input type="number" step="any" id="latitude" placeholder="Enter Latitude" required>
			</br>
			<input type="number" step="any" id="longitude" placeholder="Enter Longitude" required>
			</br>
			<button type="submit">Get Weather Location</button>
		</form>

		<h2 id="msg"></h2>
		</div>
		<script src="script.js"></script>
	</body>
</html>
